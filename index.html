<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>금요모임 성경공부</title>
<style>
:root{color-scheme:light;--house:#22372F;--label:#53715F;--accent:#2E6B4F;--tint:#E8EDE9;--ink:#2B2B2B;--soft:#707070;--hair:#D8D8D2;--ground:#F6F7F3;--surface:#FFFFFF;
  --serif:"Noto Serif KR","Noto Serif","AppleMyungjo",serif;--sans:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.7;word-break:keep-all}
.wrap{max-width:740px;margin:0 auto;padding-inline:20px}
header{background:var(--tint);border-bottom:1px solid #D2DCD5;padding:44px 0 32px}
.eyebrow{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.1em;color:var(--label)}
h1{margin:10px 0 0;font-family:var(--serif);font-weight:700;font-size:29px;color:var(--house)}
ul{list-style:none;margin:28px 0 60px;padding:0;display:grid;gap:14px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:18px 20px}
a.card:hover{border-color:#B9C8BE}
a.card:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--label)}
.t{margin:4px 0 0;font-family:var(--serif);font-weight:600;font-size:18px;color:var(--house)}
.go{margin:10px 0 0;font-size:14px;font-weight:700;color:var(--accent)}
li:first-child a.card{padding:26px 24px;border-color:var(--accent)}
li:first-child .t{font-size:23px}
@media (max-width:360px){.wrap{padding-inline:16px}}
</style>
</head>
<body>
<header><div class="wrap">
  <p class="eyebrow">SCKC 청년대학부</p>
  <h1>📖 금요모임 성경공부</h1>
</div></header>
<main class="wrap">
<ul>
  <!-- 새 주: 아래 <li> 하나를 맨 위에 복사한 뒤 날짜·제목·href만 바꾸세요 -->

  <li><a class="card" href="2026-09-11_고린도전서1장_금요모임.html"><h2>9월 11일</h2><p class="t">사도 바울의 감사</p><p class="go">학습지 열기 →</p></a></li>
</ul>
</main>
</body>
</html>
