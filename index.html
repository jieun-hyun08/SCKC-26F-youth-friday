:root{
  color-scheme: light;
  --house:#22372F; --label:#53715F; --accent:#2E6B4F; --tint:#E8EDE9; --ink:#2B2B2B;
  --soft:#707070; --hair:#D8D8D2; --phfill:#F1F1ED; --ground:#F6F7F3; --surface:#FFFFFF;
  --serif:"Noto Serif KR","Noto Serif",serif;
  --sans:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --col:740px; --gutter:20px; --ease:cubic-bezier(.2,.7,.2,1); --dur:220ms;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,p,ol{margin:0}
ol{padding:0;list-style:none}
.wrap{max-width:var(--col);margin-inline:auto;padding-inline:var(--gutter)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}

/* header — same sage band as the study sheets */
.masthead{background:var(--tint);border-bottom:1px solid #D2DCD5;padding-block:44px 34px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--label)}
h1{font-family:var(--serif);font-weight:700;font-size:31px;line-height:1.3;color:var(--house);margin-top:8px;text-wrap:balance}

/* archive of weekly sheets — newest first */
main{padding-block:34px 64px}
.studies{display:grid;gap:14px}
.study{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1.5px solid var(--hair);
  border-radius:18px;padding:22px 22px 20px;box-shadow:0 1px 2px rgba(34,55,47,.05);
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.study:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(34,55,47,.08)}
.study:active{transform:translateY(1px)}
.study:focus-visible{border-radius:18px}
.study h2{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--label);font-variant-numeric:tabular-nums}
.study .title{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.5;color:var(--house);margin-top:6px;text-wrap:balance}
.study .go{display:inline-flex;align-items:center;min-height:44px;margin-top:14px;padding:0 18px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:15.5px;font-weight:600;transition:background var(--dur) var(--ease)}
.study:hover .go{background:#285F46}

/* older weeks sit quieter than the newest one */
.studies li + li .study{padding:18px 20px}
.studies li + li .study .title{font-size:18px}
.studies li + li .study .go{background:transparent;color:var(--accent);padding:0;min-height:36px;margin-top:6px}

@media (min-width:640px){
  :root{--gutter:28px}
  .masthead{padding-block:60px 44px}
  h1{font-size:35px}
  .study{padding:26px 28px 24px}
}
@media (max-width:360px){
  :root{--gutter:16px}
  h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important}}
  </style>
</head>
